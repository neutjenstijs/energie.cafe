name: Deploy to Combell (AutoGit)

# Pusht de inhoud van deze repo naar de Combell AutoGit-remote, die de site
# vervolgens live zet. AutoGit deployt standaard de `master`-branch naar de
# hoofdsite, dus we pushen main -> master.
#
# Vereiste repo-secret:  COMBELL_SSH_KEY  (private SSH-sleutel; de bijhorende
#                        publieke sleutel moet in My Combell geregistreerd zijn)
# Volledige setup: zie BEHEER.md

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nooit twee deploys tegelijk laten lopen.
concurrency:
  group: combell-autogit-deploy
  cancel-in-progress: false

env:
  COMBELL_REMOTE: TE-INVULLEN@sshXXX.webhosting.be:auto.git   # energie.cafe-hosting, zie BEHEER.md
  COMBELL_SSH_HOST: sshXXX.webhosting.be

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (volledige historiek)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Controleer dat de deploy-secret bestaat
        env:
          COMBELL_SSH_KEY: ${{ secrets.COMBELL_SSH_KEY }}
        run: |
          if [ -z "$COMBELL_SSH_KEY" ]; then
            echo "::error::Secret COMBELL_SSH_KEY ontbreekt. Voeg toe via Settings -> Secrets and variables -> Actions. Zie BEHEER.md."
            exit 1
          fi

      - name: SSH-sleutel klaarzetten
        env:
          COMBELL_SSH_KEY: ${{ secrets.COMBELL_SSH_KEY }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$COMBELL_SSH_KEY" > "$HOME/.ssh/combell_key"
          chmod 600 "$HOME/.ssh/combell_key"
          ssh-keyscan -t rsa,ed25519 "$COMBELL_SSH_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Pushen naar Combell AutoGit
        run: |
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/combell_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          git remote add combell "$COMBELL_REMOTE" 2>/dev/null || git remote set-url combell "$COMBELL_REMOTE"
          echo "Deploying $(git rev-parse --short HEAD) -> Combell master"
          git push --force combell HEAD:master
